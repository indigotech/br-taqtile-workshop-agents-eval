# Code Review — consumer wrapper. Install once, never edit.
#
# Which engine reviews your PRs (Claude, Gemini, …) is an org-wide choice,
# declared in `active-engine` in indigotech/br-taqtile-cr-plugin — not here.
#
# Needs the `taqtile-code-review` App installed, the org secrets (they arrive
# through `secrets: inherit`) and REVIEW.md at the repo root.
#
# ⚠️ Must exist on the DEFAULT branch before the first review: the runner
#    validates the workflow against it and silently skips itself otherwise.

name: "🔍 Code Review"

on:
  pull_request:
    # `closed` closes the metrics cycle on merge — not leftover.
    types: [opened, synchronize, ready_for_review, closed]

concurrency:
  group: code-review-${{ github.event.pull_request.number }}-${{ github.event.action == 'closed' && github.run_id || 'active' }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read
  pull-requests: write
  issues: write
  # Not optional: the release channel is derived from the OIDC token claims.
  id-token: write

jobs:
  review:
    # Dependabot PRs get a separate secret store — the run would fail
    # `secrets:` validation before any step.
    if: github.event.pull_request.user.login != 'dependabot[bot]'
    # Channel: @main = stable, @develop = beta. Don't pin a tag — each channel
    # is a pointer that moves on its own.
    uses: indigotech/br-taqtile-cr-plugin/.github/workflows/review.yml@main
    secrets: inherit
