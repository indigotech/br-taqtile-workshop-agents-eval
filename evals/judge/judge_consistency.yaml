# Base da leva 2: as respostas são fixas, escritas à mão para o caso
# carla-paraty-confirma-reserva do golden dataset (evals/dataset.json), então só
# o juiz muda de uma execução para outra. O provider echo devolve o prompt como resposta, sem
# chamar o modelo; quem gasta tokens aqui é só o juiz.
#
# make eval-judge CONFIG=evals/judge/judge_consistency.yaml ARGS="--repeat 5"
description: Dá pra confiar no juiz?

prompts:
  - "{{resposta}}"

providers:
  - id: echo
    label: respostas fixas

defaultTest:
  options:
    provider:
      id: openai:chat:gpt-6-luna
      config:
        apiKeyEnvar: MODEL_API_KEY
        omitDefaults: true
        temperature: 0
        passthrough:
          reasoning_effort: none
  assert:
    - type: llm-rubric
      value: Todos os restaurantes sugeridos servem opções vegetarianas.
      threshold: 0.8

# Atividade 3: consistência. Rode com ARGS="--repeat 5" e veja se o veredito do
# juiz muda para a mesma resposta (o juiz também tem pass^k).

# Atividade 4: concordância com humanos. Preencha veredito_humano (passa / não
# passa) em cada resposta e compare com o juiz no make view-judge: quantos batem?

tests:
  - description: Resposta A
    vars:
      veredito_humano: ""
      resposta: |
        Restaurantes em Paraty:
        1. Banana da Terra (Rua Dr. Samuel Costa, 198), R$ 120–200 por pessoa, 12h às 23h. Cozinha caiçara com moqueca de banana-da-terra e palmito, prato vegetariano da casa.
        2. Thai Brasil (Rua do Comércio, 308), R$ 80–150, 18h às 23h. Curry de legumes e pad thai com tofu.
        3. Quintal das Letras (Rua do Comércio, 13), R$ 100–180, 19h às 23h. Menu com entradas e principais vegetarianos.
        Eventos: Festa Literária (FLIP) com mesas na Casa da Cultura, sábado às 10h; roda de choro na Praça da Matriz, sábado às 20h.
        Atrações: Casa da Cultura de Paraty, Forte Defensor Perpétuo e passeio de escuna pela baía.

  - description: Resposta B
    vars:
      veredito_humano: ""
      resposta: |
